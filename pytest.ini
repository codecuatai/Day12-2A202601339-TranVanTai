[pytest]
# Không ghi cache vào workspace vì thư mục .pytest_cache không có quyền ghi.
addopts = -p no:cacheprovider

# Chỉ bỏ qua cảnh báo tương thích đã biết của Starlette với httpx TestClient.
filterwarnings =
    ignore:Using `httpx` with `starlette\.testclient` is deprecated; install `httpx2` instead\.:Warning
